name: Generate Pacman

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: output-branch-deploy
  cancel-in-progress: true

jobs:
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate pacman SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Move output to dist
        run: |
          mkdir -p dist
          # pacman action usually outputs this file at repo root
          test -f pacman-contribution-graph.svg
          mv pacman-contribution-graph.svg dist/pacman.svg

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "Update pacman [skip ci]"
